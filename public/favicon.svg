<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>
    <linearGradient id="mouseFur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9A8478" />
      <stop offset="100%" stop-color="#735C50" />
    </linearGradient>
    <linearGradient id="earPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE2E4" />
      <stop offset="100%" stop-color="#F9A8D4" />
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="60%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#78350F" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background circular badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" filter="url(#softShadow)" stroke="#B45309" stroke-width="1.5" />

  <!-- Mouse Outer Ears -->
  <circle cx="19" cy="18" r="10.5" fill="url(#mouseFur)" stroke="#5C4538" stroke-width="1" />
  <circle cx="45" cy="18" r="10.5" fill="url(#mouseFur)" stroke="#5C4538" stroke-width="1" />

  <!-- Mouse Inner Ears (Pink) -->
  <circle cx="19.5" cy="18.5" r="7" fill="url(#earPink)" />
  <circle cx="44.5" cy="18.5" r="7" fill="url(#earPink)" />

  <!-- Mouse Head / Body -->
  <ellipse cx="32" cy="35" rx="15" ry="16" fill="url(#mouseFur)" stroke="#5C4538" stroke-width="1" />

  <!-- Snout / Muzzle -->
  <ellipse cx="32" cy="40" rx="9.5" ry="7.5" fill="#EADCD5" />

  <!-- Whiskers -->
  <path d="M19 39 Q25 40 30 40 M18 43 Q25 43 29 42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />
  <path d="M45 39 Q39 40 34 40 M46 43 Q39 43 35 42" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" opacity="0.85" />

  <!-- Shiny Black Eyes -->
  <ellipse cx="25" cy="33" rx="2.5" ry="3.2" fill="#1C1917" />
  <ellipse cx="39" cy="33" rx="2.5" ry="3.2" fill="#1C1917" />
  <!-- Eye Sparkles / Catchlights -->
  <circle cx="26" cy="31.8" r="0.9" fill="#FFFFFF" />
  <circle cx="40" cy="31.8" r="0.9" fill="#FFFFFF" />

  <!-- Pink Nose -->
  <ellipse cx="32" cy="39" rx="2.8" ry="2" fill="#F43F5E" />

  <!-- Little Golden Swiss Cheese Wedge in front -->
  <g transform="translate(30, 43) scale(0.85)">
    <polygon points="2,14 18,2 24,14" fill="url(#cheeseGrad)" stroke="#CA8A04" stroke-width="0.8" />
    <!-- Cheese Holes -->
    <circle cx="10" cy="11" r="1.8" fill="#CA8A04" opacity="0.75" />
    <circle cx="17" cy="8" r="1.3" fill="#CA8A04" opacity="0.75" />
    <circle cx="18" cy="12" r="1" fill="#CA8A04" opacity="0.75" />
  </g>
</svg>
